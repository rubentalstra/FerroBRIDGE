[package]
name = "ferrobridge-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "BUSL-1.1"

# The crate is deliberately OUTSIDE the workspace (the root manifest excludes
# it): cargo-fuzz builds with sanitizer flags that need a nightly toolchain,
# and the product stays on the pinned stable one (#155).
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
openehr-mapping-core = { path = "../crates/openehr-mapping-core" }
# The same pin as the workspace (docs/VERSIONS.md); the anchor path is an RmPath.
openehr-rm = "0.0.69"

[[bin]]
name = "mapping_loader"
path = "fuzz_targets/mapping_loader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mapping_path"
path = "fuzz_targets/mapping_path.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
