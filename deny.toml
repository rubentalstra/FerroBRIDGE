# cargo-deny configuration. Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# This is the ONLY advisory gate. cargo deny check advisories reads the same
# RustSec database cargo audit does and adds yanked, licenses, bans and
# sources, so there is no separate cargo-audit job.

[advisories]
version = 2
# Fail on any RustSec advisory. Add exceptions explicitly, dated, and each
# naming the event that deletes it.
yanked = "deny"
ignore = []

[licenses]
version = 2
# cargo-deny leaves dev-dependencies out of the licence check by default, on
# the ground that they reach no downstream crate and no binary. They are
# compiled here and in CI, so the check covers them: without this, the licence
# of insta, proptest and openehr-adl is never read at all
# (https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html).
include-dev = true
# Permissive licences a BUSL-1.1 project can depend on (and that its Apache 2.0
# Change License admits). Copyleft is not allowed by default; a weak-copyleft
# dependency gets a crate-scoped exceptions entry with its reason.
#
# Every entry below is carried by a crate in the current graph, so cargo deny
# reports no unencountered licence. A licence joins the list the day a
# dependency needs it, with the reason it is acceptable here, and leaves when
# the last crate carrying it does.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The project's own crates are BUSL-1.1 (LICENSE). The openEHR model crates
# join this list as they are added (openehr-sdt, openehr-query and openehr-adl
# are BUSL-1.1; openehr-its is Apache-2.0 again from 0.0.68, when the engines
# moved to openehr-sdt).
#
# openehr-term arrives transitively under openehr-rm. Its Rust code is
# Apache-2.0; the CC-BY-SA-3.0 half covers only the official openEHR
# terminology XML it redistributes verbatim from
# https://github.com/openEHR/specifications-TERM. The bridge redistributes that
# data unchanged with attribution, which is what the share-alike term asks, and
# no first-party file derives from it.
exceptions = [
  { allow = ["BUSL-1.1"], crate = "openehr-sdt" },
  # openehr-adl is a dev-dependency of openehr-mapping-core alone: the ADL 2
  # test fixtures are compiled from their .adls sources, so it never ships.
  { allow = ["BUSL-1.1"], crate = "openehr-adl" },
  # openehr-query is the AQL parser the ETL checks its configured queries with.
  { allow = ["BUSL-1.1"], crate = "openehr-query" },
  { allow = ["Apache-2.0", "CC-BY-SA-3.0"], crate = "openehr-term" },
  { allow = ["BUSL-1.1"], crate = "openehr-mapping-core" },
  { allow = ["BUSL-1.1"], crate = "fhirconnect" },
  { allow = ["BUSL-1.1"], crate = "omocl" },
  { allow = ["BUSL-1.1"], crate = "omop-cdm" },
  { allow = ["BUSL-1.1"], crate = "ferrobridge-openehr" },
  { allow = ["BUSL-1.1"], crate = "ferrobridge-term" },
  { allow = ["BUSL-1.1"], crate = "ferrobridge-server" },
  { allow = ["BUSL-1.1"], crate = "ferrobridge-testkit" },
  { allow = ["BUSL-1.1"], crate = "fhir-codegen" },
  { allow = ["BUSL-1.1"], crate = "omop-cdm-codegen" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path-only deps carry an implicit "*" version, which never reaches a
# registry. External wildcards stay denied.
allow-wildcard-paths = true
deny = []
# Each entry names a duplicate that is inherent to the pinned set: a transitive
# crate holding an older major that nothing in this workspace can move, because
# the requirement belongs to a dependency's manifest. The entry names the older
# version, so a new duplicate of the same crate still warns, and cargo deny
# reports the entry as unmatched once upstream catches up, which is how it
# deletes itself. Every entry was read off `cargo deny check bans` on
# 2026-09-13 (#145).
skip = [
  { crate = "base64@0.22.1", reason = "bollard, wiremock, tonic, hyper-util, postgres-protocol and docker_credential still require 0.22; reqwest and ureq are already on 0.23" },
  { crate = "getrandom@0.2.17", reason = "ring 0.17 alone requires 0.2; everything else in the graph is on 0.3 or 0.4" },
  { crate = "getrandom@0.3.4", reason = "rand_core 0.9, under proptest and bollard, requires 0.3; the pinned set is on rand 0.10 and getrandom 0.4" },
  { crate = "hashbrown@0.15.5", reason = "chumsky 0.13, under the openehr language crates, requires 0.15; indexmap is on 0.17" },
  { crate = "foldhash@0.1.5", reason = "hashbrown 0.15, skipped above, requires 0.1; hashbrown 0.16 and 0.17 are on 0.2" },
  { crate = "hashbrown@0.16.1", reason = "sqlx-core 0.9 and its hashlink 0.11 require 0.16; indexmap is on 0.17" },
  { crate = "sha2@0.10.9", reason = "sqlx-core 0.9 requires 0.10; the workspace is on 0.11" },
  { crate = "digest@0.10.7", reason = "the digest half of the same sqlx sha2 0.10 duplicate" },
  { crate = "block-buffer@0.10.4", reason = "under the same sqlx sha2 0.10 duplicate" },
  { crate = "crypto-common@0.1.6", reason = "under the same sqlx sha2 0.10 duplicate" },
  { crate = "cpufeatures@0.2.17", reason = "under the same sqlx sha2 0.10 duplicate" },
  { crate = "r-efi@5.3.0", reason = "a UEFI-target crate under getrandom 0.3, which is itself skipped above" },
  { crate = "syn@2.0.119", reason = "thirteen proc-macro crates still require syn 2; serde, thiserror, tokio and clap have moved to syn 3" },
  { crate = "tower-http@0.6.11", reason = "reqwest 0.13.5 requires 0.6; the server is on the pinned 0.7" },
  { crate = "wasi@0.11.1+wasi-snapshot-preview1", reason = "getrandom 0.2 and mio require the preview1 line; wasite, under whoami, is on 0.14" },
  { crate = "windows-sys@0.52.0", reason = "ring 0.17 alone requires 0.52; every other Windows consumer is on 0.61" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
