  <rect x="2" y="2" width="60" height="60" rx="13" fill="#0B1020"/>
  <path d="M12 49.5 V35.5 A19 19 0 0 1 52 35.5 V49.5" fill="none" stroke="#6366F1" stroke-width="5" stroke-linecap="round"/>
  <rect x="7" y="32.8" width="50" height="5.5" rx="2.75" fill="#818CF8"/>
  <circle cx="22" cy="35.5" r="4.1" fill="#C7D2FE"/>
  <circle cx="42" cy="35.5" r="4.1" fill="#C7D2FE"/>
</svg>
