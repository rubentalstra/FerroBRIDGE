<!-- One lockup for both themes: the media query inside the SVG switches the
     mark and wordmark tones on prefers-color-scheme, so a README or a page
     serves one file to a light and a dark reader. -->
<svg xmlns="http://www.w3.org/2000/svg" width="284" height="64" viewBox="0 0 284 64" role="img" aria-label="FerroBRIDGE">
  <title>FerroBRIDGE</title>
  <style>
    .line { stroke: #4F46E5; }
    .head { stroke: #818CF8; }
    .source, .header { fill: #4338CA; }
    .table { fill: #818CF8; }
    .wm { fill: #0F172A; }
    @media (prefers-color-scheme: dark) {
      .line { stroke: #6366F1; }
      .head { stroke: #C7D2FE; }
      .source, .header { fill: #A5B4FC; }
      .table { fill: #C7D2FE; }
      .wm { fill: #F1F5F9; }
    }
  </style>
  <g transform="translate(4,0)">
    <path class="line" d="M23.5 19 H57" fill="none" stroke-width="4.6" stroke-linecap="round"/>
    <path class="line" d="M17.5 27 L28 46 H41" fill="none" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="head" d="M29.1 13.4 L23.5 19 L29.1 24.6" fill="none" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="head" d="M51.4 13.4 L57 19 L51.4 24.6" fill="none" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="source" cx="14" cy="19" r="8"/>
    <rect class="table" x="39" y="37.6" width="17.4" height="17.4" rx="3.2"/>
    <path class="header" d="M39 43.4 V40.8 a3.2 3.2 0 0 1 3.2 -3.2 h11 a3.2 3.2 0 0 1 3.2 3.2 v2.6 Z"/>
  </g>
  <text class="wm" x="82" y="45" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="-0.3">FerroBRIDGE</text>
</svg>
