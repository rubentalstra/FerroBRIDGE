<!-- The 1200x630 social card: the mark in its dark-ground tones over the tile
     and ink grounds, with the wordmark and the three specifications the bridge
     reads. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="FerroBRIDGE, an openEHR bridge to HL7 FHIR and the OMOP Common Data Model">
  <title>FerroBRIDGE</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#4F46E5"/>
  <g transform="translate(520,130) scale(2.5)">
    <path d="M9 51.5 V34.5 A23 23 0 0 1 55 34.5 V51.5" fill="none" stroke="#6366F1" stroke-width="5.5" stroke-linecap="round"/>
    <rect x="4" y="31.5" width="56" height="6" rx="3" fill="#818CF8"/>
    <circle cx="21" cy="34.5" r="4.5" fill="#C7D2FE"/>
    <circle cx="43" cy="34.5" r="4.5" fill="#C7D2FE"/>
  </g>
  <text x="600" y="380" text-anchor="middle" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="90" font-weight="700" letter-spacing="-2" fill="#F1F5F9">FerroBRIDGE</text>
  <text x="600" y="437" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="400" fill="#F1F5F9" opacity="0.72">An openEHR bridge to HL7 FHIR and the OMOP Common Data Model.</text>
  <text x="600" y="487" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="500" letter-spacing="1" fill="#818CF8">FHIRconnect · OMOCL · openEHR ITS-REST</text>
</svg>
