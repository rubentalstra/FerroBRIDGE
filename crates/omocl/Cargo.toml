[package]
name = "omocl"
description = "The OMOCL mapping language for Rust: the mapping file model and its validation, and the interpreter emitting OMOP CDM rows from openEHR compositions"
# 0.0.0 reserves the name on crates.io; the crate line is the fhir-types line (docs/VERSIONS.md).
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/omocl"
readme = "README.md"
keywords = ["omocl", "omop", "openehr", "mapping", "healthcare"]
categories = ["parser-implementations", "science"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
include = ["src/**", "schemas/**", "README.md", "LICENSE"]

[dependencies]
jsonschema.workspace = true
# The CDM v5.4 column metadata the key-to-column projection names and the
# literal-concept domain check reads (docs/architecture.md section 7).
omop-cdm.workspace = true
openehr-mapping-core.workspace = true
# The BASE path segments the compiled program holds and the canonical JSON
# step the engine walks a composition with.
openehr-rm.workspace = true
# The ISO 8601 date and time readers a DV_DATE_TIME value is read with.
openehr-base.workspace = true
# The exact decimal a DV_QUANTITY magnitude and a `multiplication` product are
# carried in.
rust_decimal.workspace = true
# The decode bound for the openEHR RM types a node is read into.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
ferrobridge-testkit.workspace = true
insta.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
