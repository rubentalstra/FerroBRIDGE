[package]
name = "omop-cdm"
description = "The OMOP Common Data Model v5.4 for Rust: generated row types and column metadata, the embedded OHDSI DDL, the vocabulary loader and concept resolver"
# 0.0.0 reserves the name; the crate line starts at 0.1.44 (docs/VERSIONS.md).
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/omop-cdm"
readme = "README.md"
keywords = ["omop", "ohdsi", "cdm", "vocabulary", "healthcare"]
categories = ["database", "science"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]

[dev-dependencies]
ferrobridge-testkit.workspace = true

[lints]
workspace = true
