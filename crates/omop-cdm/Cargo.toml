[package]
name = "omop-cdm"
description = "The OMOP Common Data Model v5.4 for Rust: generated row types and column metadata, the embedded OHDSI DDL, the vocabulary loader and concept resolver"
# 0.0.0 reserves the name on crates.io; the crate line is the fhir-types line (docs/VERSIONS.md).
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/omop-cdm"
readme = "README.md"
keywords = ["omop", "ohdsi", "cdm", "vocabulary", "healthcare"]
categories = ["database", "science"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
# `ddl/` holds the four OHDSI DDL files the generated `ddl` module embeds;
# `.sqlx/` is the query metadata the `vocabulary` queries compile against;
# `sql/` holds the PostgreSQL forms of the era scripts the CDM publishes.
include = ["src/**", "ddl/**", "sql/**", ".sqlx/**", "README.md", "LICENSE"]

# `database` carries the PostgreSQL side: the schema binding, the concept
# resolver, the CDM writer and the derived tables. A consumer that reads only
# the metadata and the record graph takes the crate with
# `default-features = false` and builds no database client.
[features]
default = ["database"]
database = [
    "dep:sqlx",
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:tokio",
    "dep:futures-util",
]

[dependencies]
futures-util = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
# The CDM writer's client: binary COPY inside one transaction per composition,
# on a connection of its own beside the sqlx pool.
tokio = { workspace = true, optional = true, features = ["rt"] }
tokio-postgres = { workspace = true, optional = true }
# The writer's TLS, after the connection URL's `sslmode`.
rustls = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[dev-dependencies]
ferrobridge-testkit.workspace = true
# The era scripts are checked against the digest of the page they follow.
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
tokio-postgres.workspace = true

[lints]
workspace = true
