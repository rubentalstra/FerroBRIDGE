[package]
name = "fhirconnect-engine"
description = "The bidirectional FHIRconnect interpreter between openEHR compositions and FHIR resources"
# 0.0.0 reserves the name; the crate line starts at 0.1.44 (docs/VERSIONS.md).
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/fhirconnect-engine"
readme = "README.md"
keywords = ["fhirconnect", "fhir", "openehr", "mapping", "healthcare"]
categories = ["science"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]

[dev-dependencies]
ferrobridge-testkit.workspace = true

