[package]
name = "openehr-path"
description = "openEHR path execution for FerroBRIDGE: the Web Template built from the operational template, the aqlPath index with leaf RM type resolution, and composition build and read"
# 0.0.0 reserves the name; the crate line starts at 0.1.44 (docs/VERSIONS.md).
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/openehr-path"
readme = "README.md"
keywords = ["openehr", "web-template", "opt", "healthcare"]
categories = ["science"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]

[dev-dependencies]
ferrobridge-testkit.workspace = true

[lints]
workspace = true
