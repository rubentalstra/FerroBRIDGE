[package]
name = "fhirconnect"
description = "The FHIRconnect mapping language for Rust: the mapping file model and its validation, context resolution into an immutable program, and the bidirectional interpreter between openEHR compositions and FHIR resources"
# 0.0.0 reserves the name on crates.io; the crate line is the fhir-types line (docs/VERSIONS.md).
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/fhirconnect"
readme = "README.md"
keywords = ["fhirconnect", "fhir", "openehr", "mapping", "healthcare"]
categories = ["parser-implementations", "science"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
include = ["src/**", "schemas/**", "README.md", "LICENSE"]

[dependencies]
jsonschema.workspace = true
openehr-mapping-core.workspace = true
# The openEHR RM path model the mapping foundation resolves a path into
# (docs/architecture.md section 3); the foundation returns its types, so this
# crate names the same crate rather than re-exporting them.
openehr-rm.workspace = true
serde_json.workspace = true
# The generated FHIR model: the lexical `Value` tree the path model walks and
# the element table that guides it (docs/architecture.md section 4.1).
fhir-types = { workspace = true, features = ["r4", "resources"] }
thiserror.workspace = true

[dev-dependencies]
ferrobridge-testkit.workspace = true
insta.workspace = true
# The operational-template parser the resolve tests build their Web Template
# with; the crate itself takes the built template from its caller.
openehr-its.workspace = true
proptest.workspace = true

[lints]
workspace = true
