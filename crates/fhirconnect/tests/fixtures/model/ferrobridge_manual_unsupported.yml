# A FerroBRIDGE-authored model mapping whose manual block writes
# DV_TEXT.hyperlink below the DV_CODED_TEXT node of items[at0073]. The
# reference model carries the attribute, and no FLAT part of the class does,
# so the engine refuses the entry.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_manual_unsupported
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Condition

mappings:
  - name: "problemName"
    with:
      fhir: "$resource.code"
      openehr: "$archetype/data[at0001]/items[at0002]"
      type: "CODEABLECONCEPT"

  - name: "certainty"
    with:
      fhir: "$resource"
      openehr: "$archetype/data[at0001]/items[at0073]"
    manual:
      - name: "linked"
        openehr:
          - path: "hyperlink/value"
            value: "http://example.org/ferrobridge/certainty"
