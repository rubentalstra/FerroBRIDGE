# A FerroBRIDGE-authored model mapping whose certainty mappings name
# reference-model attributes below the DV_CODED_TEXT node of items[at0073],
# one scalar attribute each, so the engine can be driven over a tail in both
# directions against the synthetic ferrobridge.diagnose.v1 template.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_tail
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Condition

mappings:
  - name: "problemName"
    with:
      fhir: "$resource.code"
      openehr: "$archetype/data[at0001]/items[at0002]"
      type: "CODEABLECONCEPT"

  - name: "certainty"
    with:
      fhir: "$resource.verificationStatus.coding"
      openehr: "$archetype/data[at0001]/items[at0073]"
      type: "NONE"
    followedBy:
      mappings:
        - name: "certaintyCode"
          with:
            fhir: "code"
            openehr: "value/defining_code/code_string"
        - name: "certaintySystem"
          with:
            fhir: "system"
            openehr: "value/defining_code/terminology_id/value"
        - name: "certaintyText"
          with:
            fhir: "display"
            openehr: "value/value"
