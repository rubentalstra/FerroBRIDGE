# A FerroBRIDGE-authored model mapping over the minimal problem-diagnosis
# chain: the problem or diagnosis name, its date of onset, and one mapping the
# engine runs in one direction only. It exists so the interpreter can be driven
# both ways over the synthetic ferrobridge.diagnose.v1 template of the testkit
# and the synthetic FHIR Condition beside it.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_diagnose_minimal
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Condition

mappings:
  - name: "problemDiagnose"
    with:
      fhir: "$resource.code"
      openehr: "$archetype/data[at0001]/items[at0002]"
      type: "CODEABLECONCEPT"

  - name: "onset"
    with:
      fhir: "$resource.onset.ofType(dateTime)"
      openehr: "$archetype/data[at0001]/items[at0077]"
      type: "DATETIME"

  - name: "recordedDateOutboundOnly"
    unidirectional: "openehr->fhir"
    with:
      fhir: "$resource.recordedDate"
      openehr: "$archetype/data[at0001]/items[at0003]"
      type: "DATETIME"
