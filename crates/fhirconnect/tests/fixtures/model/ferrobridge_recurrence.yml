# A FerroBRIDGE-authored model mapping that writes two openEHR elements into
# one repeating FHIR element and two more into one that holds a single value,
# so the engine can be driven over both recurrence rules of
# recurrence/TransformingList.adoc and recurrence/Overwriting.adoc.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_recurrence
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Condition

mappings:
  - name: "bodySiteFromProblemName"
    with:
      fhir: "$resource.bodySite"
      openehr: "$archetype/data[at0001]/items[at0002]"
      type: "CODEABLECONCEPT"

  - name: "bodySiteFromSeverity"
    with:
      fhir: "$resource.bodySite"
      openehr: "$archetype/data[at0001]/items[at0005]"
      type: "CODEABLECONCEPT"

  - name: "textFromProblemName"
    with:
      fhir: "$resource.code.text"
      openehr: "$archetype/data[at0001]/items[at0002]"
      type: "STRING"

  - name: "textFromComment"
    with:
      fhir: "$resource.code.text"
      openehr: "$archetype/data[at0001]/items[at0069]"
      type: "STRING"
