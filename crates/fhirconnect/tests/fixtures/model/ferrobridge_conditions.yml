# A FerroBRIDGE-authored model mapping whose only purpose is to carry one
# condition per operator of the Conditions chapter, so the engine can evaluate
# each of the five against the synthetic FHIR Condition of the testkit. Every
# code system is example.org, which RFC 6761 section 6.5 reserves for examples.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_conditions
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Condition

mappings:
  - name: "identifierOneOf"
    with:
      fhir: "$resource.identifier"
      openehr: "$archetype/data[at0001]/items[at0002]"
    fhirCondition:
      targetRoot: "$resource.identifier"
      targetAttribute: "system"
      operator: "one of"
      criteria: "http://example.org/fhir/sid/ferrobridge-condition"

  - name: "identifierNotOf"
    with:
      fhir: "$resource.identifier"
      openehr: "$archetype/data[at0001]/items[at0005]"
    fhirCondition:
      targetRoot: "$resource.identifier"
      targetAttribute: "system"
      operator: "not of"
      criteria: "http://example.org/fhir/sid/ferrobridge-retired"

  - name: "bodySiteEmpty"
    with:
      fhir: "$resource.code.text"
      openehr: "$archetype/data[at0001]/items[at0069]"
    fhirCondition:
      targetRoot: "$resource.bodySite"
      targetAttribute: "coding"
      operator: "empty"

  - name: "codeNotEmpty"
    with:
      fhir: "$resource.code.text"
      openehr: "$archetype/data[at0001]/items[at0002]"
    fhirCondition:
      targetRoot: "$resource.code"
      targetAttribute: "coding"
      operator: "not empty"

  - name: "codeType"
    with:
      fhir: "$resource.code.text"
      openehr: "$archetype/data[at0001]/items[at0002]"
    fhirCondition:
      targetRoot: "$resource.code"
      operator: "type"
      criteria: "CodeableConcept"

  - name: "onsetWhenCertaintyPresent"
    with:
      fhir: "$resource.onset.ofType(dateTime)"
      openehr: "$archetype/data[at0001]/items[at0077]"
      type: "DATETIME"
    openehrCondition:
      targetRoot: "$archetype/data[at0001]"
      targetAttributes:
        - "items[at0073]"
      operator: "not empty"

  - name: "recordedDateOutboundOnly"
    unidirectional: "openehr->fhir"
    with:
      fhir: "$resource.recordedDate"
      openehr: "$archetype/data[at0001]/items[at0003]"
      type: "DATETIME"
