# A modified copy of projects/org.highmed/KDS/diagnose/KDS_diagnose.context.yaml,
# a derivative of it under its licence.
# Source: SevKohler/FHIRconnect-mapping-lib at commit 6bd4c19a (vendored
# under docs/specs/fhirconnect-mapping-lib), Apache License 2.0; the source
# file carries no copyright line to keep.
# Changed: the metadata name and version are FerroBRIDGE's; the profile, the
# template, the archetype list and the start are the published file's. The extension
# list names FerroBRIDGE's stand-ins for KDS_problem_diagnose and
# KDS_composition.Condition, which do not load, for KDS_problem_qualifier,
# whose manual paths write a string onto TERMINOLOGY_ID, and the published
# KDS_lebensphase verbatim. KDS_anatomical_location
# loads but is not listed: the one branch that reaches it slots a cluster that
# does not compile (#173). The round-trip test records each refusal by line.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_kds_diagnose.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "https://www.medizininformatik-initiative.de/fhir/core/modul-diagnose/StructureDefinition/Diagnose"
    version: "2025.0.0"
  template:
    id: "KDS_Diagnose"
  archetypes:
    - "CLUSTER.multiple_coding_icd10gm.v1"
    - "EVALUATION.problem_diagnosis.v1"
    - "CLUSTER.problem_qualifier.v2"
    - "CLUSTER.lebensphase.v0"
    - "CLUSTER.case_identification.v0"
    - "CLUSTER.anatomical_location.v1"
    - "COMPOSITION.report.v1.Condition"
  extensions:
    - "ferrobridge_kds_problem_diagnose"
    - "ferrobridge_kds_problem_qualifier"

    - "KDS_lebensphase"
    - "ferrobridge_kds_composition.Condition"
  start: "EVALUATION.problem_diagnosis.v1"
