# Source: SevKohler/FHIRconnect-mapping-lib at commit 6bd4c19a (vendored
# under docs/specs/fhirconnect-mapping-lib), Apache License 2.0; the source
# file carries no copyright line to keep.
# Changed: the metadata name and version are FerroBRIDGE's; the published
# line 9 extends COMPOSITION.report_result.v1.Condition, a name no model of the
# library carries (#101), so this file extends COMPOSITION.report.v1.Condition,
# which the library ships; the published mappings follow unchanged, then
# FerroBRIDGE's overwrites for the model's methods that do not compile against
# KDS_Diagnose.
grammar: FHIRConnect/v1.0.0
type: extension
metadata:
  name: ferrobridge_kds_composition.Condition
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  extends: COMPOSITION.report.v1.Condition

mappings:
  - name: "fallIdentifikationIdentifier"
    extension: "add"
    with:
      fhir: "$resource.encounter.ofType(Reference).identifier"
      openehr: "$composition/context/other_context[at0001]/items[openEHR-EHR-CLUSTER.case_identification.v0]"
    slotArchetype: "CLUSTER.case_identification.v0"

  - name: "fallIdentifikationReference" # if reference is accessible overwrite fallIdentifikationIdentifier
    extension: "add"
    with:
      openehr: "$reference"
      fhir: "$resource.encounter"
    reference: #type None
      resourceType: "Encounter"
      mappings:
        - name: "identifierInReference"
          with:
            fhir: "$fhirRoot.identifier"
            openehr: "$composition/context/other_context[at0001]/items[openEHR-EHR-CLUSTER.case_identification.v0]"
          slotArchetype: "CLUSTER.case_identification.v0"
        - name: "encounterMapping"
          with:
            fhir: "$fhirRoot"
            openehr: "$composition/context/other_context[at0001]/items[openEHR-EHR-CLUSTER.case_identification.v0]/links" # will use link
          link:
            meaning: "the case this composition relates to"
            type: "case"

  # The published model's lines 60 to 67, 90 to 97 and 134 to 141 write
  # `null_flavour` below `context/start_time` (a DV_DATE_TIME) and `composer`
  # (a PARTY_PROXY); the openEHR RM carries `null_flavour` on ELEMENT only,
  # so against KDS_Diagnose these methods map nothing.
  - name: "contextStartTimeEmpty"
    extension: "overwrite"
    with:
      fhir: "$resource"
      openehr: "$composition/context"
      type: "NONE"

  - name: "composerEmpty"
    extension: "overwrite"
    with:
      fhir: "$resource"
      openehr: "$composition"
      type: "NONE"
