# The context that compiles the split model mapping beside this file against
# the synthetic ferrobridge.diagnose.v1 template of the testkit. The profile
# URL is example.org, which RFC 6761 section 6.5 reserves for examples.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_split.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://example.org/fhir/StructureDefinition/ferrobridge-split"
  template:
    id: "ferrobridge.diagnose.v1"
  archetypes:
    - "ferrobridge_split"
  start: "ferrobridge_split"
