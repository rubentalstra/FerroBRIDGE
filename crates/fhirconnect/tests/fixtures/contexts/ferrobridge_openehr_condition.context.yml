# The context that compiles the openehrCondition model mapping beside this file
# against the synthetic ferrobridge.diagnose.v1 template of the testkit. The
# profile URL is example.org, which RFC 6761 section 6.5 reserves for examples.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_openehr_condition.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://example.org/fhir/StructureDefinition/ferrobridge-openehr-condition"
  template:
    id: "ferrobridge.diagnose.v1"
  archetypes:
    - "ferrobridge_openehr_condition"
  start: "ferrobridge_openehr_condition"
