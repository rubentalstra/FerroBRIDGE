# examples.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_split_unique.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://example.org/fhir/StructureDefinition/ferrobridge-split-unique"
  template:
    id: "ferrobridge.diagnose.v1"
  archetypes:
    - "ferrobridge_split_unique"
  start: "ferrobridge_split_unique"
