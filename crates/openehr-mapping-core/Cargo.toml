[package]
name = "openehr-mapping-core"
description = "The shared foundation of the FerroBRIDGE mapping languages: the common header model, the YAML loader, the mapping registry, the diagnostic model, and openEHR path resolution and execution over the Web Template"
# 0.0.0 reserves the name on crates.io; the crate line is the fhir-types line (docs/VERSIONS.md).
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/openehr-mapping-core"
readme = "README.md"
keywords = ["openehr", "fhirconnect", "omocl", "mapping", "healthcare"]
categories = ["parser-implementations", "science"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
openehr-am.workspace = true
openehr-its.workspace = true
openehr-rm.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
ferrobridge-testkit.workspace = true
insta.workspace = true
# Test-only: the ADL 2 fixtures under tests/fixtures are compiled from their
# .adls sources by the suite that reads them (docs/VERSIONS.md).
openehr-adl.workspace = true
proptest.workspace = true

[lints]
workspace = true
