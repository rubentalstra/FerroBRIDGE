[package]
name = "ferrobridge-openehr"
description = "The FerroBRIDGE openEHR ITS-REST 1.1.0 client with typed outcomes per status"
# 0.0.0 reserves the name; the crate line starts at 0.1.44 (docs/VERSIONS.md).
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrobridge-openehr"
readme = "README.md"
keywords = ["openehr", "its-rest", "client", "healthcare"]
categories = ["web-programming::http-client", "science"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]

[dev-dependencies]
ferrobridge-testkit.workspace = true

[lints]
workspace = true
