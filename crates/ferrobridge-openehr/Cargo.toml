[package]
name = "ferrobridge-openehr"
description = "The FerroBRIDGE openEHR ITS-REST 1.1.0 client with typed outcomes per status"
# 0.0.0 reserves the name on crates.io; the crate line is the fhir-types line (docs/VERSIONS.md).
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ferrobridge-openehr"
readme = "README.md"
keywords = ["openehr", "its-rest", "client", "healthcare"]
categories = ["web-programming::http-client", "science"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
backon.workspace = true
futures-core.workspace = true
futures-util.workspace = true
http.workspace = true
openehr-adl.workspace = true
openehr-am.workspace = true
openehr-base.workspace = true
openehr-its.workspace = true
openehr-rm.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
ferrobridge-testkit.workspace = true
http.workspace = true
openehr-its.workspace = true
openehr-sdt.workspace = true
openehr-rm.workspace = true
secrecy.workspace = true
serde_json.workspace = true
futures-util = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
wiremock.workspace = true

[lints]
workspace = true
