[package]
name = "fhirconnect-model"
description = "The FHIRconnect mapping file model: the AST, the strict schemas and the semantic validation of model, extension and context mappings"
# 0.0.0 reserves the name; the crate line starts at 0.1.44 (docs/VERSIONS.md).
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/fhirconnect-model"
readme = "README.md"
keywords = ["fhirconnect", "fhir", "openehr", "mapping", "healthcare"]
categories = ["parser-implementations", "science"]
# The crate line is published on crates.io; include is the packaged content.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]

[dev-dependencies]
ferrobridge-testkit.workspace = true

[lints]
workspace = true
