[package]
name = "fhir-codegen"
description = "Generates the fhir-types crate from the vendored FHIR packages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "fhir-codegen"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The tests read the wide root set too, so the generated crate is built with
# every feature the emitter distinguishes.
fhir-types = { workspace = true, features = ["resources"] }
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true
