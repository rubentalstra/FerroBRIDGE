[package]
name = "ferrobridge-testkit"
description = "Test support for the FerroBRIDGE suites: the pin-matrix reader, fixtures and stubs; never shipped"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[dependencies]
reqwest.workspace = true
serde_json.workspace = true
sqlx.workspace = true
# The scratch directory the throwaway TLS material is generated in.
tempfile.workspace = true
testcontainers.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
wiremock.workspace = true

[dev-dependencies]
# The corpus suite re-hashes the vendored FHIRconnect schemas, so it needs a
# sha256 the workspace does not otherwise carry.
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
