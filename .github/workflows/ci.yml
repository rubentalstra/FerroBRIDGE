# CI in two tiers.
#
#   1. The workflow, shell, container and guard tier runs NOW, on a repository
#      with no code: zizmor over .github, actionlint over .github/workflows,
#      shellcheck over the tracked shell programs, hadolint over any
#      Dockerfile, and the committed comment-style and versions guards. These
#      keep this very file honest, so none of them may depend on Rust existing.
#   2. The Rust tier is gated behind a detection job that looks for a root
#      Cargo.toml. Every cargo lane is skipped cleanly until the workspace
#      lands and then activates by itself, with no workflow edit. hashFiles()
#      cannot gate a job at `if:` time, because the workspace is empty before
#      checkout, so a real detection job is the correct primitive.
#
# The `conclusion` job is the single required status check on main; it is what
# makes a mostly-skipped pipeline enforceable (docs/ci-cd.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` re-runs the contribution-licence guard when the checkbox is ticked.
    types: [opened, synchronize, reopened, edited]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on a pull request only. A push to main and a
  # merge-group run each verify a distinct commit that must keep its own
  # result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default: each job grants its own.
# The hosted runner has four cores and seven gigabytes. Every cargo invocation
# builds two crates at a time, so a large generated crate never compiles beside
# three others; the all-features union of fhir-types is kept out of CI
# altogether (see the clippy jobs), because that one crate compile alone
# exceeded the memory and the runner killed the job (exit 143, no diagnostic).
env:
  CARGO_BUILD_JOBS: "2"

permissions: {}

jobs:
  # ---- Tier 1: the checks that run on a repository with no code -------------

  # zizmor (https://docs.zizmor.sh/) is the static security analysis for GitHub
  # Actions, the machine check behind three properties this repository treats
  # as hard rules: every `uses:` pinned to a commit SHA (unpinned-uses), no
  # checkout persisting credentials (artipacked), and no context value spliced
  # into a shell (template-injection).
  #
  # The audit path is the whole of .github, not just the workflows: zizmor also
  # reads dependabot.yml (dependabot-cooldown) and composite actions under
  # .github/actions, which run with the calling workflow's permissions and are
  # the same class of live, token-holding code (#34).
  workflow-audit:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: zizmor@1.30.1
      - name: Audit .github
        # GH_TOKEN enables the online audits. impostor-commit verifies that a
        # pinned commit really belongs to the repository named in front of it,
        # which it cannot do offline. --min-severity=low gates every actionable
        # tier and leaves the informational tier advisory.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/

  # actionlint is the correctness half of the pair: `${{ }}` expressions that
  # cannot evaluate, `needs:` naming a job that does not exist, unknown runner
  # labels, and shellcheck over every embedded `run:` block.
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint .github/workflows
        # The official image, digest-pinned. actionlint is a Go binary rather
        # than a crate, and its README's alternative is `curl | bash` off main,
        # the unpinned fetch the pinning rule forbids. The image also bundles
        # shellcheck, which half of actionlint's value depends on.
        #
        # SC2016 ("expressions don't expand in single quotes") is excluded, and
        # only it: every occurrence here is a printf format or a jq filter,
        # where single quotes are the correct idiom.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  # shellcheck over the tracked shell programs: the CI guards, the tracker
  # helpers, and the hooks. `--severity=style` is the lowest floor, so every
  # finding gates. A finding is fixed, or it carries a per-line
  # `# shellcheck disable=SCnnnn` directive with its reason. There is no
  # .shellcheckrc, deliberately: nothing may turn a code off tree-wide
  # (.claude/rules/ci-cd.md).
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The upstream release binary, pinned by version, rather than the
      # runner's distro package, which moves at every runner-image refresh.
      # Fetched by the same SHA-pinned installer, which verifies the checksum.
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: shellcheck@0.11.0
      - name: Every tracked shell program is clean at severity=style
        run: |
          set -euo pipefail
          # Every tracked *.sh, plus every tracked extensionless file whose
          # first line is a shell shebang, which covers the git hooks. A
          # NUL-delimited pipe, so a path with a space survives.
          {
            git ls-files -z '*.sh'
            git ls-files -z | while IFS= read -r -d '' f; do
              case "$f" in
                *.*) ;;
                *) head -c2 "$f" 2>/dev/null | grep -q '#!' \
                     && head -n1 "$f" | grep -qE 'sh$' && printf '%s\0' "$f" ;;
              esac
            done
          } | { grep -zc . >/dev/null && xargs -0 -r shellcheck --severity=style; } \
            || echo "no shell files to check"

  # hadolint over every tracked Dockerfile, under the committed .hadolint.yaml
  # (failure-threshold: warning). No Dockerfile exists yet, so the step reports
  # that and passes; it gains teeth the moment a container recipe lands.
  dockerfile-lint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every tracked Dockerfile passes hadolint
        # The official image, digest-pinned, for the same reason as actionlint:
        # hadolint is a Haskell binary with no checksum-verified installer in
        # the pinned tool set.
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done \
            < <(git ls-files -z 'Dockerfile' '*/Dockerfile' '*.Dockerfile' 'Dockerfile.*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no Dockerfile to check"
            exit 0
          fi
          printf 'checking: %s\n' "${files[@]}"
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint --config .hadolint.yaml "${files[@]}"

  # The comment-style guard (.claude/rules/comments.md, RFC 505 and RFC 1574)
  # over the whole tree. It reads .rs files only, so it reports "no files to
  # check" today and gates from the first hand-written source file.
  comment-style:
    name: comment-style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/comment-style.sh --all

  # The file-length guard: a hand-written Rust file stays under 1000 lines and
  # a listed breach may not grow (`.claude/rules/rust-style.md` §File and
  # module size, #351).
  file-length:
    name: file-length
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/file-length.sh

  # The version-drift guard. It compares every present config file against
  # docs/VERSIONS.md and skips loudly for the files that have not landed yet,
  # so it is useful now and grows teeth as files appear.
  versions:
    name: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/versions.sh

  # The book theme favicons are copies of the brand mark, so the mark exists
  # twice and only this guard keeps the two byte-identical (#52).
  favicon-sync:
    name: favicon-sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/checks/favicon-sync.sh

  # ---- Tier 2: the Rust lanes, gated on the workspace existing --------------

  # The one job that decides whether the cargo tier runs at all: it checks out
  # and looks for a root Cargo.toml. Every Rust job below `needs` it.
  detect:
    name: detect workspace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cargo: ${{ steps.check.outputs.cargo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          set -euo pipefail
          if [ -f Cargo.toml ]; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml present: the Rust lanes will run."
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml: the Rust lanes are skipped (repository in its design phase)."
          fi

  fmt:
    name: rustfmt
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-hack
      # One package at a time, the way the msrv job compiles and passes: a
      # workspace-wide check schedules the two generated giants (fhir-types with
      # its four versions, openehr-am behind the client) side by side and the
      # runner's seven gigabytes run out; per package they never meet. Default
      # features here; the per-version `resources` surface of fhir-types is
      # linted by clippy-fhir-types below, and the all-features union (four
      # versions, every resource, one crate) is no consumer's surface.
      - run: cargo hack clippy --workspace --all-targets --locked -- -D warnings

  clippy-fhir-types:
    name: clippy-fhir-types (${{ matrix.version }}, resources)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: [r4, r4b, r5, r6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      # One version with every resource is what a consumer builds; each is one
      # crate compile and fits the runner.
      - env:
          VERSION: ${{ matrix.version }}
        run: cargo clippy --locked -p fhir-types --all-targets --no-default-features --features "$VERSION,resources" -- -D warnings

  test:
    name: test
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-nextest,cargo-hack
      # The fhir-codegen tests read the HL7 v2 definitions, which are fetched
      # at build time and never committed; the same cache and check as
      # codegen-drift.
      - name: Read the pinned HL7 v2 definitions commit
        id: v2ig
        run: echo "commit=$(bash scripts/vendor/v2ig.sh --commit)" >> "$GITHUB_OUTPUT"
      - name: Restore the HL7 v2 definitions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/fhir-codegen/vendor/hl7-v2ig/input
          key: hl7-v2ig-${{ steps.v2ig.outputs.commit }}
      - name: Fetch and verify the HL7 v2 definitions
        run: bash scripts/vendor/v2ig.sh
      - name: Read the pinned HL7 v2 legacy tables commit
        id: v2-legacy
        run: echo "commit=$(bash scripts/vendor/v2-legacy.sh --commit)" >> "$GITHUB_OUTPUT"
      - name: Restore the HL7 v2 legacy tables
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/fhir-codegen/vendor/hl7-v2-legacy/src
          key: hl7-v2-legacy-${{ steps.v2-legacy.outputs.commit }}
      - name: Fetch and verify the HL7 v2 legacy tables
        run: bash scripts/vendor/v2-legacy.sh
      # The hl7v2-smoke corpus test reads the NIST and AIRA message sets,
      # fetched at build time and never committed
      # (crates/ferrobridge-hl7v2/vendor/nist/PROVENANCE.md). The cache is
      # keyed on their pins, and the script verifies the count and digest of a
      # restored tree as it does of a download.
      - name: Read the pinned HL7 v2 sample sets
        id: hl7v2-samples
        run: echo "key=$(bash scripts/vendor/hl7v2-samples.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the HL7 v2 sample sets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/ferrobridge-hl7v2/vendor/nist/lri-r2
            crates/ferrobridge-hl7v2/vendor/nist/loi-r1
            crates/ferrobridge-hl7v2/vendor/nist/ss-r2
            crates/ferrobridge-hl7v2/vendor/aira-mqe/examples
          key: hl7v2-samples-${{ steps.hl7v2-samples.outputs.key }}
      - name: Fetch and verify the HL7 v2 sample sets
        run: bash scripts/vendor/hl7v2-samples.sh --build-time
      # One package at a time, as the clippy and msrv lanes do: a workspace-wide
      # test build schedules the generated giants side by side and the runner
      # kills it with exit 143 (docs/ci-cd.md).
      - run: cargo hack nextest run --workspace --locked --no-tests=pass
      # nextest does not run doctests, so they get their own compile.
      - run: cargo hack test --doc --workspace --locked

  # The conformance gate (#24): the corpus tests measure the vendored
  # FHIRconnect and OMOCL libraries, the round-trip chains, the draft REST
  # API's operation definitions and the HL7 v2 message sets against the
  # committed pass lists under conformance/. A case a list records that no
  # longer passes fails the job, and so does an unrecorded new pass or a badge
  # that disagrees with its list. The script runs one package per nextest
  # invocation, as the test lane does through cargo hack, so the generated
  # giants never compile side by side, and fetches the build-time HL7 v2 sets
  # this job restores from the test lane's cache key.
  conformance:
    name: conformance
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-nextest
      - name: Read the pinned HL7 v2 sample sets
        id: hl7v2-samples
        run: echo "key=$(bash scripts/vendor/hl7v2-samples.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the HL7 v2 sample sets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/ferrobridge-hl7v2/vendor/nist/lri-r2
            crates/ferrobridge-hl7v2/vendor/nist/loi-r1
            crates/ferrobridge-hl7v2/vendor/nist/ss-r2
            crates/ferrobridge-hl7v2/vendor/aira-mqe/examples
          key: hl7v2-samples-${{ steps.hl7v2-samples.outputs.key }}
      - run: scripts/checks/conformance.sh --check

  # The container-backed lane. Every test behind the harness returns early
  # unless FERROBRIDGE_E2E is 1, so this job is the only run where the
  # PostgreSQL and the reference CDR actually start. testcontainers talks to
  # the runner's own Docker daemon, so `services:` is not used: the harness
  # creates the network and both containers itself and tears them down on drop.
  # The images are public, so no registry credential is needed. Per package,
  # never --workspace: a workspace-wide compile schedules the generated giants
  # side by side and the runner runs out of memory.
  e2e:
    name: e2e (containers)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FERROBRIDGE_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked -p omop-cdm -p ferrobridge-server -p ferrobridge-term -p ferrobridge-testkit --no-tests=pass

  # The sqlx query metadata of omop-cdm (#89). The crate's queries compile
  # offline from crates/omop-cdm/.sqlx/; this job builds the CDM schema from
  # the vendored DDL in a service container and fails when that metadata no
  # longer describes the queries. The image is the docs/VERSIONS.md PostgreSQL
  # row, which scripts/checks/versions.sh compares with this file. The service
  # trusts local connections, so no credential is written here. sqlx-cli is
  # not in taiki-e/install-action's own tool list, so the action installs it
  # through its cargo-binstall fallback.
  sqlx-offline:
    name: sqlx-offline
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: ferrobridge
          POSTGRES_DB: ferrobridge
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=ferrobridge --dbname=ferrobridge"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: sqlx-cli@0.9.0
      - run: scripts/checks/sqlx-offline.sh --check
        env:
          DATABASE_URL: postgres://ferrobridge@127.0.0.1:5432/ferrobridge

  doc:
    name: rustdoc
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The [workspace.lints.rustdoc] levels apply to every `cargo doc`; -D
      # turns a broken intra-doc link into a failed build.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo doc --locked --workspace --no-deps --all-features --document-private-items

  cargo-deny:
    name: cargo-deny
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-deny
      # Reads the same RustSec advisory database as cargo-audit and adds
      # yanked, licences, bans and sources, so there is no separate audit job.
      - run: cargo deny check

  msrv:
    name: msrv (cargo-hack)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-hack
      # The Cargo book's named tool for verifying the declared rust-version,
      # which it reads from the workspace `rust-version`.
      - run: cargo hack check --rust-version --workspace --locked --all-targets

  # The feature matrix of the generated crate (#120): one tree holds the union
  # of the declared root sets, so every feature combination the emitter
  # distinguishes has to compile on its own.
  fhir-types-features:
    name: fhir-types-features (cargo-hack)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-hack
      # `--no-dev-deps` rewrites the workspace manifests, which `--locked`
      # then refuses; the crate has no dev-dependencies, so the flag would
      # change nothing here.
      - run: cargo hack check -p fhir-types --each-feature --locked
      # The widest selection one version carries, which no single-feature run
      # reaches.
      - run: cargo check -p fhir-types --no-default-features --features r4,resources --locked

  # The codegen drift gate (.claude/rules/codegen.md): regenerate
  # crates/fhir-types from the vendored HL7 packages and fail on any
  # difference. The emitter shells out to rustfmt, so the toolchain needs that
  # component.
  codegen-drift:
    name: codegen-drift
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      # The HL7 v2 definitions are fetched at build time and never committed
      # (tools/fhir-codegen/vendor/hl7-v2ig/PROVENANCE.md). The cache is keyed
      # on the pinned commit, and the script verifies the file count and tree
      # digest of a restored tree as it does of a download.
      - name: Read the pinned HL7 v2 definitions commit
        id: v2ig
        run: echo "commit=$(bash scripts/vendor/v2ig.sh --commit)" >> "$GITHUB_OUTPUT"
      - name: Restore the HL7 v2 definitions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/fhir-codegen/vendor/hl7-v2ig/input
          key: hl7-v2ig-${{ steps.v2ig.outputs.commit }}
      - name: Fetch and verify the HL7 v2 definitions
        run: bash scripts/vendor/v2ig.sh
      # The HL7 v2 legacy tables are fetched and cached the same way
      # (tools/fhir-codegen/vendor/hl7-v2-legacy/PROVENANCE.md).
      - name: Read the pinned HL7 v2 legacy tables commit
        id: v2-legacy
        run: echo "commit=$(bash scripts/vendor/v2-legacy.sh --commit)" >> "$GITHUB_OUTPUT"
      - name: Restore the HL7 v2 legacy tables
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/fhir-codegen/vendor/hl7-v2-legacy/src
          key: hl7-v2-legacy-${{ steps.v2-legacy.outputs.commit }}
      - name: Fetch and verify the HL7 v2 legacy tables
        run: bash scripts/vendor/v2-legacy.sh
      - run: cargo run --locked -p fhir-codegen -- emit --check

  # The same gate for the OMOP side: regenerate crates/omop-cdm from the
  # vendored OHDSI CommonDataModel definitions and fail on any difference.
  omop-cdm-codegen-drift:
    name: omop-cdm-codegen-drift
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo run --locked -p omop-cdm-codegen -- emit --check

  # The per-crate bump rule (.claude/rules/crates-publishing.md): a pull
  # request that changes a crate's packaged content moves that crate's version
  # in the same change, because a published version is immutable. The
  # `no-crate-bump` label is the escape for a diff that provably alters no
  # packaged bytes.
  crate-version-guard:
    name: crate-version-guard
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-crate-bump')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Packaged crate content moved with its version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/checks/crate-version-guard.sh "$BASE" "$HEAD"

  # Every publishable crate packages and verifies as crates.io would build it,
  # so a release's crates leg finds no surprise. No cache: the dry run checks
  # the bytes a publish would upload (.claude/rules/ci-cd.md).
  publish-dry-run:
    name: publish-dry-run
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - run: cargo publish --workspace --dry-run --locked

  dependency-review:
    name: dependency-review
    needs: detect
    # Pull requests only: the action compares the base..head dependency graph,
    # which a push has no diff for. Also gated on the workspace, so it stays
    # quiet while the repository has no manifest.
    if: github.event_name == 'pull_request' && needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block a pull request that introduces a vulnerable or
          # disallowed-licence dependency. The licence policy mirrors
          # deny.toml once that file exists.
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---- The single required check -------------------------------------------

  # conclusion is the one status check the branch ruleset requires. It `needs`
  # every other job and runs on always(), so it reports even when every gated
  # Rust lane is skipped. It fails when a needed job failed or was cancelled
  # and passes when every result is success or skipped. The results arrive
  # through env:, never spliced into run: (.claude/rules/ci-cd.md).
  # A person's pull request records acceptance of the contribution licensing
  # terms (CONTRIBUTING.md § Licensing of contributions) through the template's
  # checkbox; this gate is what makes the checkbox binding. Bot authors are
  # skipped: a bot cannot accept terms and its bumps carry no expression of its
  # own. `edited` is in the pull_request trigger so ticking the box re-runs it.
  contribution-licence:
    name: contribution-licence-guard
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pull request body accepts the contribution licensing terms
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/checks/contribution-licence.sh

  conclusion:
    name: conclusion
    needs:
      - contribution-licence
      - workflow-audit
      - workflow-lint
      - shellcheck
      - dockerfile-lint
      - comment-style
      - file-length
      - versions
      - favicon-sync
      - detect
      - fmt
      - clippy
      - clippy-fhir-types
      - test
      - conformance
      - e2e
      - sqlx-offline
      - doc
      - cargo-deny
      - msrv
      - fhir-types-features
      - codegen-drift
      - omop-cdm-codegen-drift
      - crate-version-guard
      - publish-dry-run
      - dependency-review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"
