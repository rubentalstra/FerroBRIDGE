# The freshness half of the pin discipline (#35).
#
# scripts/checks/versions.sh catches drift between two files we control, and
# Dependabot bumps what its ecosystems read, which is `uses:` references and
# the manifests. Between the two sits a set of pins nothing watches: the
# actionlint and hadolint container images named inside a `run:` block, the
# analyzer versions handed to taiki-e/install-action as an input, and the
# documentation toolchain the mermaid assets are vendored from. This workflow
# reads the newest upstream release of each and opens ONE issue when a pin is
# behind.
#
# It opens an issue rather than failing: a weekly red job trains a maintainer
# to ignore red jobs (#41), and a newer lint release is not a broken build.
name: Pin freshness

on:
  schedule:
    # Monday morning, after the weekly Dependabot run, so both arrive together.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  freshness:
    name: pin freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare every unwatched pin with its newest upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          status=0
          bash scripts/checks/pin-freshness.sh > freshness.txt || status=$?
          cat freshness.txt
          # 0 every pin current, 1 at least one behind, 2 a release could not
          # be read. Only 1 opens an issue; 2 fails the job, because a pin that
          # could not be compared is not a pin known to be fresh.
          if [ "$status" -eq 2 ]; then
            echo "a release could not be read; the comparison is incomplete" >&2
            exit 1
          fi
          echo "stale=$([ "$status" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Open an issue when a pin is behind
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: A pinned CI tool is behind its newest upstream release
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          open="$(gh issue list --state open --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | length")"
          if [ "$open" -ne 0 ]; then
            echo "an open issue already carries this report; not opening a second"
            exit 0
          fi
          {
            echo "\`scripts/checks/pin-freshness.sh\` found a pin behind its newest upstream release."
            echo
            echo "Bump the pin in \`docs/VERSIONS.md\` and in the file that repeats it, keep the local"
            echo "install on the same number, and re-run the gates. The digest beside an image tag"
            echo "moves with the tag, so read the new digest from the registry rather than guessing it."
            echo
            echo '```text'
            cat freshness.txt
            echo '```'
            echo
            echo "Reported by [this run]($RUN_URL)."
          } > body.md
          gh issue create --title "$TITLE" --body-file body.md --label ci --label P3
