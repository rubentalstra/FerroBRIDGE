[package]
name = "ferrobridge-server"
description = "The FerroBRIDGE server: the FHIR facade and the OMOP ETL runner over an openEHR CDR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

# A thin main.rs over a testable lib.rs (.claude/rules/testing.md).
[lib]
path = "src/lib.rs"

[[bin]]
name = "ferrobridge"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
ferrobridge-openehr.workspace = true
ferrobridge-term.workspace = true
http.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
ferrobridge-testkit.workspace = true
# The shutdown cases drive a real socket, so they need a real HTTP client.
reqwest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net"] }
tower.workspace = true
wiremock.workspace = true

[lints]
workspace = true
