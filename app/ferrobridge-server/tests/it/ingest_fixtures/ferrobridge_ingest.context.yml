# The context the ingest suite runs: one Observation profile onto the
# synthetic ferrobridge.diagnose.v1 template of the testkit, so a Bundle
# carries one mapped type beside types no program maps. The profile URL is
# example.org, which RFC 6761 section 6.5 reserves for examples.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_ingest.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://example.org/fhir/StructureDefinition/ferrobridge-ingest-observation"
  template:
    id: "ferrobridge.diagnose.v1"
  archetypes:
    - "ferrobridge_ingest_observation"
  start: "ferrobridge_ingest_observation"
