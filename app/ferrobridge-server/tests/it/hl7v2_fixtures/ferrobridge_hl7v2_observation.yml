# The model mapping the HL7 v2 face suite runs: the text of an Observation's
# code (OBX-3.9 through the guide's CWE map) and its effective time (OBX-14)
# onto the name and the date of onset of the synthetic ferrobridge.diagnose.v1
# template. The code's codings are left out because the guide's CWE.1 row
# carries a narrative condition the interpreter does not run, so no coding
# the run writes carries a code. The pairing is synthetic and models no
# clinical practice.
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: ferrobridge_hl7v2_observation
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Observation

mappings:
  - name: "finding"
    with:
      fhir: "$resource.code.text"
      openehr: "$archetype/data[at0001]/items[at0002]"
      type: "STRING"

  - name: "effective"
    with:
      fhir: "$resource.effective.ofType(dateTime)"
      openehr: "$archetype/data[at0001]/items[at0077]"
      type: "DATETIME"
