# The context the HL7 v2 face suite runs: the Observation a v2-to-FHIR run
# writes from OBX, onto the synthetic ferrobridge.diagnose.v1 template of the
# testkit. The profile URL is example.org, which RFC 6761 section 6.5 reserves
# for examples, and the face's configuration claims it for an Observation.
grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: ferrobridge_hl7v2.context
  version: 1.0.0
spec:
  system: FHIR
  version: R4
context:
  profile:
    url: "http://example.org/fhir/StructureDefinition/ferrobridge-hl7v2-observation"
  template:
    id: "ferrobridge.diagnose.v1"
  archetypes:
    - "ferrobridge_hl7v2_observation"
  start: "ferrobridge_hl7v2_observation"
